# QwenWork 团队网关 Nginx 反代配置
# 用途：TLS 终止 + 对外统一入口。证书自备（certbot 或公司签发）。

# 建议 server_tokens off; 且开启限流防扫描
server_tokens off;

# API 限流：每 IP 30 req/s，突发 60（长流式连接不受 body 限速影响）
limit_req_zone $binary_remote_addr zone=qwg_api:10m rate=30r/s;

upstream qwenwork_gateway {
    server 127.0.0.1:8787;
    # 流式对话可能持续数分钟：连接保持、慢启动都放宽
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qwg.your-corp.com;  # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/qwg.your-corp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qwg.your-corp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 客户端上传的请求体可能含大量代码上下文（Claude Code 单请求可达数十 MB）
    client_max_body_size 100m;
    client_body_timeout 60s;

    # 长流式响应：不缓冲（SSE 必须逐块透传，缓冲会让 Claude Code/Codex 卡死）
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 流式空闲超时：模型长思考时上游只有 ping/心跳；300s 与网关看门狗对齐
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        limit_req zone=qwg_api burst=60 nodelay;
        proxy_pass http://qwenwork_gateway;
    }
}

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name qwg.your-corp.com;
    return 301 https://$host$request_uri;
}
